[theme]
base = "dark"

# Dark OLED palette — deep blue-black backgrounds
primaryColor = "#3B82F6"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
linkColor = "#58a6ff"
borderColor = "#30363d"

# Code blocks
codeBackgroundColor = "#161b22"
codeTextColor = "#d2a8ff"
codeFont = "'Fira Code':https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap"

# Typography
font = "'Fira Sans':https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap"
headingFont = "'Fira Sans':https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Borders and radius
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

# Status colors — high contrast on dark
redColor = "#f85149"
orangeColor = "#d29922"
yellowColor = "#e3b341"
greenColor = "#3fb950"
blueColor = "#58a6ff"
violetColor = "#bc8cff"
grayColor = "#8b949e"

# Chart palette — neon-on-dark
chartCategoricalColors = ["#3B82F6", "#3FB950", "#F85149", "#D29922", "#BC8CFF", "#58A6FF", "#F0883E"]
chartSequentialColors = ["#0d1117", "#161b22", "#1c2333", "#21283b", "#292e3b", "#30363d", "#3b4252", "#484f58", "#6e7681", "#8b949e"]

# Dataframe
dataframeBorderColor = "#30363d"
dataframeHeaderBackgroundColor = "#161b22"

[theme.sidebar]
backgroundColor = "#010409"
secondaryBackgroundColor = "#0d1117"
codeBackgroundColor = "#161b22"
textColor = "#e6edf3"
borderColor = "#21262d"
primaryColor = "#3B82F6"
